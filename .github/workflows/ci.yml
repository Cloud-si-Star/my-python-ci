name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 运行测试
      run: pytest -v --junitxml=report.xml -m alone

    - name: 展示测试报告
      if: always()
      uses: dorny/test-reporter@v1
      with:
       name: Pytest Results
       path: report.xml
       reporter: java-junit